name: Update profile activity visuals

on:
  schedule:
    # 01:15 UTC = 06:45 Asia/Kolkata, daily.
    - cron: "15 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Generate contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&hide_border=true&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/ assets/streak.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile activity visuals"
            git push
          fi
